apiVersion: v1
kind: Namespace
metadata:
  name: dnd-tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: dnd-tools
data:
  config.yaml: |
    model_list:
      - model_name: campaign-local
        litellm_params:
          model: ollama/qwen2.5:3b
          api_base: http://ollama:11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnd-tools-data
  namespace: dnd-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: dnd-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nano-banana-mcp
  namespace: dnd-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nano-banana-mcp
  template:
    metadata:
      labels:
        app: nano-banana-mcp
    spec:
      containers:
        - name: mcp
          image: nano-banana-2-mcp-rs:local
          imagePullPolicy: Never
          env:
            - name: NANO_BANANA_TRANSPORT
              value: streamable-http
            - name: NANO_BANANA_BIND_ADDRESS
              value: 0.0.0.0:3000
            - name: NANO_BANANA_OUTPUT_DIR
              value: /app/generated_imgs
            - name: NANO_BANANA_ALLOWED_HOSTS
              value: nano-banana-mcp,nano-banana-mcp.dnd-tools.svc
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nano-banana-mcp
                  key: GEMINI_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: generated-images
              mountPath: /app/generated_imgs
      volumes:
        - name: generated-images
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nano-banana-mcp
  namespace: dnd-tools
spec:
  selector:
    app: nano-banana-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: dnd-tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "16"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: dnd-tools
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 30434
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: dnd-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:846795f2a2b5787ce2155170fd33b9ae886fd925f26635424ee613d53ece2fa4
          args:
            - --config
            - /app/config.yaml
            - --host
            - 0.0.0.0
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: dnd-tools
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30400
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-tools
  namespace: dnd-tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dnd-tools
  template:
    metadata:
      labels:
        app: dnd-tools
    spec:
      containers:
        - name: web
          image: dnd-tools:local
          imagePullPolicy: Never
          env:
            - name: LITELLM_BASE_URL
              value: http://litellm:4000
            - name: LITELLM_API_KEY
              value: local-kind
            - name: DND_DEFAULT_MODEL
              value: campaign-local
            - name: DND_CAMPAIGN_MAX_TOKENS
              value: "2600"
            - name: NANO_BANANA_MCP_URL
              value: http://nano-banana-mcp:3000/mcp
            - name: CAMPAIGN_IMAGE_PROVIDERS
              value: none
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dnd-tools-data
---
apiVersion: v1
kind: Service
metadata:
  name: dnd-tools
  namespace: dnd-tools
spec:
  selector:
    app: dnd-tools
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
  type: NodePort
